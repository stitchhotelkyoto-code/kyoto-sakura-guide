<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakura Guide - Kyoto Sakura Guide</title>
  <link rel="stylesheet" href="./css/style.css" />

  <style>

    .subpage-widget-nav {
      margin-top: 10px;
      margin-bottom: 18px;
    }

    .subpage-widget-nav .container {
      padding-top: 0;
      padding-bottom: 0;
    }

    .subpage-widget-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 12px;
      border: 1px solid #efd0dc;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(10px);
    }

    .subpage-widget-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 54px;
      padding: 0 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #efd0dc;
      font-weight: 800;
    }

    .subpage-widget-card.is-active {
      background: #f4dbe5;
    }



    .page-heading {
      margin-top: 10px;
      margin-bottom: 28px;
    }

    .page-heading .container {
      padding: 36px 28px;
      border: 1px solid #efd0dc;
      border-radius: 24px;
      background: linear-gradient(180deg, #fff 0%, #fff9fb 100%);
      box-shadow: 0 10px 30px rgba(40,20,30,0.04);
    }

    /* eyebrow = pill */
    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(216,140,169,0.12);
      color: #c26c8c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }


    .page-heading h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 800;
      line-height: 1.2;
      color: #1f1f1f;
    }

    .page-desc {
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.7;
      color: #6b5a60;
      max-width: 720px;
    }
  </style>
</head>

<body data-all-page="sakura">
  <div class="page-shell">


    <header class="site-header">
      <div class="container site-header-inner">
        <a href="./index.html" class="site-logo">Kyoto Sakura Guide</a>

        <div class="header-right">
          <nav class="site-nav">
            <a href="./index.html">Home</a>
            <a href="./hotels/soraniwa.html">Soraniwa</a>
            <a href="./hotels/bettei.html">Bettei</a>
            <a href="./hotels/hiyori.html">Hiyori</a>
            <a href="./hotels/stitch.html">STITCH</a>
          </nav>

          <div class="lang-switcher">
            <button class="lang-btn">JP</button>
            <button class="lang-btn">EN</button>
            <button class="lang-btn">KR</button>
          </div>
        </div>
      </div>
    </header>


    <section class="subpage-widget-nav">
      <div class="container">
        <div class="subpage-widget-grid">
          <a href="./all-sakura.html" class="subpage-widget-card is-active">🌸 Sakura</a>
          <a href="./all-course.html" class="subpage-widget-card">🗺 Course</a>
          <a href="./all-events.html" class="subpage-widget-card">🎎 Events</a>
          <a href="./crowd-live.html" class="subpage-widget-card">📍 Crowd</a>
        </div>
      </div>
    </section>

    <main>


      <section class="page-heading">
        <div class="container">
          <p class="eyebrow">SAKURA GUIDE</p>
          <h1>Sakura Spots</h1>
          <p class="page-desc">
            Discover the most beautiful cherry blossom locations across Kyoto.
          </p>
        </div>
      </section>


      <section class="all-page-content">
        <div class="container">
          <div data-all-content></div>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <div class="container">Kyoto Sakura Guide © Spring Stay Project</div>
    </footer>
  </div>

</body>
</html>
