<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STITCH HOTEL Kyoto | Kyoto Sakura Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/hotel-detail.css" />
</head>
<body data-hotel-page="stitch">
  <div class="page-shell">
    <header class="site-header">
      <div class="container site-header-inner">
        <a href="../index.html" class="site-logo">Kyoto Sakura Guide</a>
        <div class="header-right">
          <nav class="site-nav">
            <a href="../index.html" data-i18n="nav_home">Home</a>
            <a href="./soraniwa.html" data-i18n="nav_soraniwa">Soraniwa</a>
            <a href="./hiyori.html" data-i18n="nav_hiyori">Hiyori</a>
            <a href="./stitch.html" data-i18n="nav_stitch">STITCH</a>
            <a href="../all-sakura.html" data-i18n="nav_sakura">Sakura</a>
            <a href="../all-food.html" data-i18n="nav_food">Food</a>
            <a href="../all-events.html" data-i18n="nav_events">Events</a>
            <a href="../crowd-live.html" data-i18n="nav_crowd">Crowd</a>
            <a href="../ai-guide.html" data-i18n="nav_ai">AI Guide</a>
          </nav>
          <div class="lang-switcher">
            <button class="lang-btn" data-lang="jp" type="button">JP</button>
            <button class="lang-btn" data-lang="en" type="button">EN</button>
            <button class="lang-btn" data-lang="kr" type="button">KR</button>
          </div>
        </div>
      </div>
    </header>

    <main class="hotel-detail-page">
      <div class="hotel-hero-box" id="hotelHeroBox"></div>

      <div class="hotel-brand-box" id="hotelBrandBox"></div>

      <div class="hotel-gallery-section">
        <div class="hotel-gallery-grid" id="hotelGalleryGrid"></div>
        <div class="hotel-gallery-nav">
          <button class="hotel-gallery-arrow" id="hotelGalleryPrev" type="button">←</button>
          <button class="hotel-gallery-arrow" id="hotelGalleryNext" type="button">→</button>
        </div>
      </div>

      <div class="hotel-info-grid">
        <div class="hotel-info-box">
          <div class="hotel-info-head">
            <span>01</span>
            <h3>Recommended Course</h3>
          </div>
          <div class="hotel-list" id="hotelCourseList"></div>
        </div>

        <div class="hotel-info-box">
          <div class="hotel-info-head">
            <span>02</span>
            <h3>Food Picks</h3>
          </div>
          <div class="hotel-list" id="hotelFoodList"></div>
        </div>

        <div class="hotel-info-box">
          <div class="hotel-info-head">
            <span>03</span>
            <h3>Nearby Events</h3>
          </div>
          <div class="hotel-list" id="hotelEventList"></div>
        </div>
      </div>

      <div class="hotel-course-detail" id="hotelCourseDetail">
        <div class="hotel-course-detail-inner">
          <div class="hotel-course-detail-front" id="hotelCourseFront">
            <p class="hotel-course-detail-label">COURSE DETAIL</p>
            <h3 id="hotelCourseFrontTitle">코스를 선택해 주세요</h3>
            <p id="hotelCourseFrontDesc">왼쪽의 1~5번 코스를 누르면 상세 설명이 나옵니다.</p>
          </div>

          <div class="hotel-course-detail-back" id="hotelCourseBack">
            <p class="hotel-course-detail-label">HOW TO GO</p>
            <h3 id="hotelCourseBackTitle"></h3>
            <p class="hotel-course-route" id="hotelCourseBackRoute"></p>
            <p class="hotel-course-back-desc" id="hotelCourseBackDesc"></p>
            <a class="hotel-mini-btn" id="hotelCourseDirectionBtn" href="#" target="_blank" rel="noopener noreferrer">
              Directions
            </a>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">STITCH HOTEL Kyoto Guide © Kyoto Sakura Guide</div>
    </footer>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/hotel-detail.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderHotelPage("stitch");
    });
  </script>
</body>
</html>
