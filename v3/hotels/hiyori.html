<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hiyori Stay Kyoto Gojo | Kyoto Sakura Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/hotel-detail.css" />
</head>
<body data-hotel-page="hiyori">
  <div class="page-shell">
    <header class="site-header">
      <div class="container site-header-inner">
        <a href="../index.html" class="site-logo">Kyoto Sakura Guide</a>
        <div class="header-right">
          <nav class="site-nav">
            <a href="../index.html" data-i18n="nav_home">Home</a>
            <a href="./soraniwa.html" data-i18n="nav_soraniwa">Soraniwa</a>
            <a href="./hiyori.html" data-i18n="nav_hiyori">Hiyori</a>
            <a href="./stitch.html" data-i18n="nav_stitch">STITCH</a>
            <a href="../all-sakura.html" data-i18n="nav_sakura">Sakura</a>
            <a href="../all-food.html" data-i18n="nav_food">Food</a>
            <a href="../all-events.html" data-i18n="nav_events">Events</a>
            <a href="../crowd-live.html" data-i18n="nav_crowd">Crowd</a>
            <a href="../ai-guide.html" data-i18n="nav_ai">AI Guide</a>
          </nav>
          <div class="lang-switcher">
            <button class="lang-btn" data-lang="jp" type="button">JP</button>
            <button class="lang-btn" data-lang="en" type="button">EN</button>
            <button class="lang-btn" data-lang="kr" type="button">KR</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="hotel-hero">
        <div class="container">
          <div class="hotel-hero-box">
            <div class="hotel-hero-intro">
              <p class="hotel-hero-label" data-hotel-label></p>
              <h1 data-hotel-name></h1>
              <p class="hotel-hero-tagline" data-hotel-tagline></p>
              <p class="hotel-hero-description" data-hotel-description></p>
            </div>
            <div class="hotel-tabs" data-hotel-tabs></div>
          </div>
        </div>
      </section>

      <section class="section section-tight">
        <div class="container">
          <div class="hotel-sub-intro">
            <p class="hotel-sub-label" data-hotel-sub-label></p>
            <h2 data-intro-title></h2>
            <p data-intro-text></p>
          </div>

          <div class="hotel-slider-block">
            <div class="card-slider-wrap" data-cards></div>
          </div>

          <div class="hotel-info-grid">
            <div class="hotel-info-box">
              <div class="info-box-head"><span class="info-kicker">01</span><h3 data-i18n="section_course">Recommended Course</h3></div>
              <ul class="info-list" data-course></ul>
            </div>
            <div class="hotel-info-box">
              <div class="info-box-head"><span class="info-kicker">02</span><h3 data-i18n="section_food">Food Picks</h3></div>
              <ul class="info-list" data-food></ul>
            </div>
            <div class="hotel-info-box">
              <div class="info-box-head"><span class="info-kicker">03</span><h3 data-i18n="section_events">Nearby Events</h3></div>
              <ul class="info-list" data-events></ul>
            </div>
          </div>

          <div class="hotel-course-detail" id="hotelCourseDetail">
  <div class="hotel-course-detail-inner">
    <div class="hotel-course-detail-front is-empty">
      <div class="hotel-course-detail-front-inner">
        <p class="hotel-course-detail-label" data-detail-front-label></p>
        <h3 data-detail-front-title></h3>
        <p data-detail-front-desc></p>
      </div>
    </div>

    <div class="hotel-course-detail-back">
      <div class="hotel-course-detail-back-inner">
        <p class="hotel-course-detail-label" data-detail-back-label></p>
        <h3 data-detail-back-title></h3>
        <p class="hotel-course-route" data-detail-back-route></p>
        <p class="hotel-course-back-desc" data-detail-back-desc></p>
        <a class="hotel-mini-btn" data-detail-direction href="#" target="_blank" rel="noopener noreferrer">Directions</a>
      </div>
    </div>
  </div>
</div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">Kyoto Sakura Guide © Spring Stay Project</div>
    </footer>
  </div>

  <script src="../js/hotel-data.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
