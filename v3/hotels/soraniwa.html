<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soraniwa Hotel - Kyoto Sakura Guide</title>
  <link rel="icon" href="../favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/hotel-detail.css">
</head>
<body class="hotel-detail-page" data-hotel-page="soraniwa">
  <header class="site-header">
    <div class="container site-header-inner">
      <a class="site-logo" href="../index.html">Kyoto Sakura Guide</a>

      <div class="header-right">
        <nav class="site-nav">
           <a href="../index.html">Home</a>
          <a href="soraniwa.html">Soraniwa</a>
          <a href="bettei.html">Bettei</a>
          <a href="hiyori.html">Hiyori</a>
          <a href="stitch.html">STITCH</a>
        </nav>

        <div class="lang-switcher">
          <button class="lang-btn is-active" data-lang="jp" type="button">JP</button>
          <button class="lang-btn" data-lang="en" type="button">EN</button>
          <button class="lang-btn" data-lang="kr" type="button">KR</button>
        </div>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <section class="hero-card">
      <p class="eyebrow" data-hotel-label></p>
      <h1 class="hero-title" data-hotel-name></h1>
      <p class="hero-tagline" data-hotel-tagline></p>
      <p class="hero-desc" data-hotel-description></p>
      <div class="hotel-hero-links">
  <a class="hotel-hero-link" href="https://soraniwa-hotel.jp/" target="_blank" rel="noopener noreferrer">
    Official Website
  </a>
  <a class="hotel-hero-link" href="https://www.instagram.com/soraniwa.kyoto/" target="_blank" rel="noopener noreferrer">
    Instagram
  </a>
</div>
    </section>

    <section class="section-card">
      <p class="eyebrow">BRAND VIEW</p>
      <h2 class="section-title" data-intro-title></h2>
      <p class="section-desc" data-intro-text></p>
    </section>

    <section class="hotel-photo-grid" data-photo-grid></section>

    <section class="hotel-tabs-shell">
  <div class="hotel-tabs-nav" data-hotel-tabs-nav>
    <button class="hotel-tab-btn is-active" type="button" data-tab-target="course">
      Recommended Course
    </button>
    <button class="hotel-tab-btn" type="button" data-tab-target="food">
      Food Picks
    </button>
    <button class="hotel-tab-btn" type="button" data-tab-target="events">
      Nearby Events
    </button>
  </div>

  <div class="hotel-tabs-body">
    <section class="hotel-tab-panel is-active" data-tab-panel="course">
      <div class="panel-card hotel-tab-card" data-course-panel></div>
    </section>

    <section class="hotel-tab-panel" data-tab-panel="food">
      <div class="panel-card hotel-tab-card" data-food-panel></div>
    </section>

    <section class="hotel-tab-panel" data-tab-panel="events">
      <div class="panel-card hotel-tab-card" data-events-panel></div>
    </section>
  </div>
</section>
  </main>

  <footer class="footer-note">
    Kyoto Sakura Guide © Spring Stay Project
  </footer>

  <script src="../js/hotel-data.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
