<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events Guide - Kyoto Sakura Guide</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="stylesheet" href="./css/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    .page-heading {
      margin-top: 10px;
      margin-bottom: 28px;
    }

    .page-heading .container {
      padding: 36px 28px;
      min-height: 150px;
      border: 1px solid #efd0dc;
      border-radius: 24px;
      background: linear-gradient(180deg, #fff 0%, #fff9fb 100%);
      box-shadow: 0 10px 30px rgba(40, 20, 30, 0.04);
    }

    .eyebrow {
      display: inline-block;
      margin: 0 0 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(216, 140, 169, 0.12);
      color: #c26c8c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.2;
    }

    .page-heading h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 800;
      line-height: 1.2;
      color: #1f1f1f;
    }

    .page-desc {
      margin: 12px 0 0;
      max-width: none;
      font-size: 15px;
      line-height: 1.7;
      color: #6b5a60;
      white-space: normal;
      overflow: visible;
      text-overflow: unset;
    }

    .site-logo {
      font-size: 1rem !important;
      font-weight: 800 !important;
      letter-spacing: 0.02em !important;
      line-height: 1 !important;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .page-heading .container {
        padding: 24px 20px;
        border-radius: 24px;
        min-height: unset;
      }
    }
  </style>
</head>
<body data-all-page="events">
  <div class="page-shell">
    <header class="site-header">
      <div class="container site-header-inner">
        <a href="./index.html" class="site-logo">Kyoto Sakura Guide</a>

        <div class="header-right">
          <nav class="site-nav">
            <a href="./index.html" data-i18n="nav_home">Home</a>
            <a href="./hotels/soraniwa.html" data-i18n="nav_soraniwa">Soraniwa</a>
            <a href="./hotels/bettei.html" data-i18n="nav_bettei">Bettei</a>
            <a href="./hotels/hiyori.html" data-i18n="nav_hiyori">Hiyori</a>
            <a href="./hotels/stitch.html" data-i18n="nav_stitch">STITCH</a>
          </nav>

          <div class="lang-switcher">
            <button class="lang-btn" type="button" data-lang="jp">JP</button>
            <button class="lang-btn" type="button" data-lang="en">EN</button>
            <button class="lang-btn" type="button" data-lang="kr">KR</button>
          </div>
        </div>
      </div>
    </header>

    <section class="subpage-widget-nav">
      <div class="container">
        <div class="subpage-widget-grid">
          <a href="./all-sakura.html" class="subpage-widget-card">
            <span class="subpage-widget-icon">🌸</span>
            <span class="subpage-widget-text" data-i18n="widget_sakura">Sakura Spots</span>
          </a>

          <a href="./all-course.html" class="subpage-widget-card">
            <span class="subpage-widget-icon">🗺️</span>
            <span class="subpage-widget-text" data-i18n="widget_courses">Travel Courses</span>
          </a>

          <a href="./all-events.html" class="subpage-widget-card is-active">
            <span class="subpage-widget-icon">🎎</span>
            <span class="subpage-widget-text" data-i18n="widget_events">Events</span>
          </a>

          <a href="./crowd-live.html" class="subpage-widget-card">
            <span class="subpage-widget-icon">📍</span>
            <span class="subpage-widget-text" data-i18n="widget_crowd">Live Crowd</span>
          </a>
        </div>
      </div>
    </section>

    <main>
      <section class="page-heading">
        <div class="container">
          <p class="eyebrow" data-i18n="events_heading_eyebrow">EVENTS GUIDE</p>
          <h1 data-i18n="widget_events">Events</h1>
          <p class="page-desc" data-i18n="events_heading_desc">
            Discover seasonal cherry blossom events and special spring moments across Kyoto.
          </p>
        </div>
      </section>

      <section class="all-page-content">
        <div class="container">
          <div data-all-content></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">Kyoto Sakura Guide ©Sun Frontier Hotel Management Inc.</div>
    </footer>
  </div>

  <script src="./js/hotel-data.js"></script>
  <script src="./js/main.js"></script>

  <script>
    window.I18N = window.I18N || {};

    Object.assign(window.I18N, {
      jp: {
        ...(window.I18N.jp || {}),
        events_heading_eyebrow: "EVENTS GUIDE",
        events_heading_desc: "京都で楽しめる桜イベントや、春ならではの特別なひとときをご案内します。"
      },
      en: {
        ...(window.I18N.en || {}),
        events_heading_eyebrow: "EVENTS GUIDE",
        events_heading_desc: "Discover seasonal cherry blossom events and special spring moments across Kyoto."
      },
      kr: {
        ...(window.I18N.kr || {}),
        events_heading_eyebrow: "EVENTS GUIDE",
        events_heading_desc: "교토에서 즐길 수 있는 벚꽃 이벤트와 봄 시즌의 특별한 순간들을 소개합니다."
      }
    });

    document.addEventListener("DOMContentLoaded", function () {
      function applyEventsHeadingI18n(lang) {
        const dict = window.I18N?.[lang] || window.I18N?.jp || {};

        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (dict[key]) el.textContent = dict[key];
        });
      }

      function detectLang() {
        const activeBtn =
          document.querySelector(".lang-btn.is-active") ||
          document.querySelector(".lang-btn.active");
        if (activeBtn && activeBtn.dataset.lang) return activeBtn.dataset.lang;

        const htmlLang = document.documentElement.lang;
        if (htmlLang === "en") return "en";
        if (htmlLang === "kr" || htmlLang === "ko") return "kr";
        return "jp";
      }

      applyEventsHeadingI18n(detectLang());

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          applyEventsHeadingI18n(btn.dataset.lang || "jp");
        });
      });
    });
  </script>
</body>
</html>
